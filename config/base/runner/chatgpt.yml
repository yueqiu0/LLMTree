config:
  runner: openai_api
  runner_args:
    model_name: "Qwen/Qwen2.5-72B-Instruct-Turbo"
    api_base: "https://api.together.xyz/v1"
    request_interval: 0.2
    timeout: 20
    parallel_batch_size: 6
    temperature: 0.7
    top_p: 0.9
    top_k: 30
    seed: 42
    presence_penalty: 0.0
    frequency_penalty: 0.0

