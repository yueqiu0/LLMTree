name: blood
target: Predict whether a person will donate blood in March 2007
desc: >
  Data collected from the Blood Transfusion Service Center in Hsin-Chu City, Taiwan.
  Each record describes donor behavior using RFMTC marketing variables (recency,
  frequency, monetary value, and time since first donation).

label_meaning: Blood donation behavior

features:
  - name: recency
    desc: Months since last blood donation (months)
    type: int

  - name: frequency
    desc: Total number of blood donations made (times)
    type: int

  - name: monetary
    desc: Total volume of blood donated (c.c.)
    type: int

  - name: time
    desc: Months since the first recorded blood donation (months)
    type: int

labels:
  - name: donated
    value: 1
    desc: The person donated blood in March 2007
  - name: not_donated
    value: 0
    desc: The person did not donate blood in March 2007
