name: diabetes
target: Predict whether a patient has diabetes based on diagnostic measurements.
desc: >
  Collected by the National Institute of Diabetes and Digestive and Kidney Diseases.
  The dataset includes female patients of Pima Indian heritage aged 21 years or older,
  with medical attributes derived from glucose tolerance tests and other diagnostic measurements.
label_meaning: Diabetes diagnosis
features:
  - name: pregnancies
    desc: Number of times the patient was pregnant
    type: int
  - name: glucose
    desc: Plasma glucose concentration after 2 hours in an oral glucose tolerance test (mg/dl)
    type: int
  - name: blood_pressure
    desc: Diastolic blood pressure (mm Hg)
    type: int
  - name: skin_thickness
    desc: Triceps skin fold thickness (mm)
    type: int
  - name: insulin
    desc: 2-hour serum insulin (μU/ml)
    type: int
  - name: bmi
    desc: Body mass index (kg/m²)
    type: float
  - name: diabetes_pedigree_function
    desc: Diabetes pedigree function
    type: float
  - name: age
    desc: Age of the patient (years)
    type: int
labels:
  - name: no
    value: 0
    desc: Patient does not have diabetes
  - name: yes
    value: 1
    desc: Patient has diabetes
