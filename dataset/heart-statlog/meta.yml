name: heart-statlog
target: Predict the presence or absence of heart disease based on clinical features
desc: ''
label_meaning: presence of heart disease (1 = presence, 0 = absence)

features:
  - name: age
    desc: Age of the patient in years
    type: int
  - name: sex
    desc: Gender (1 = male, 0 = female)
    type: int
  - name: chest
    desc: Chest pain type (1 = typical angina, 2 = atypical angina, 3 = non-anginal pain, 4 = asymptomatic)
    type: int
  - name: resting_blood_pressure
    desc: Resting blood pressure in mm Hg on admission
    type: int
  - name: serum_cholestoral
    desc: Serum cholesterol in mg/dl
    type: int
  - name: fasting_blood_sugar
    desc: Fasting blood sugar > 120 mg/dl (1 = true; 0 = false)
    type: int
  - name: resting_electrocardiographic_results
    desc: Resting electrocardiographic results (0 = normal; 1 = ST‑T wave abnormality; 2 = probable or definite left ventricular hypertrophy)
    type: int
  - name: maximum_heart_rate_achieved
    desc: Maximum heart rate achieved during exercise test
    type: int
  - name: exercise_induced_angina
    desc: Exercise induced angina (1 = yes; 0 = no)
    type: int
  - name: oldpeak
    desc: ST depression induced by exercise relative to rest
    type: float
  - name: slope
    desc: Slope of the peak exercise ST segment (1 = upsloping; 2 = flat; 3 = downsloping)
    type: int
  - name: number_of_major_vessels
    desc: Number of major vessels (0-3) colored by fluoroscopy
    type: int
  - name: thal
    desc: Thalassemia:(3 = normal; 6 = fixed defect; 7 = reversible defect)
    type: int

labels:
  - name: absence
    value: 0
    desc: no presence of heart disease
  - name: presence
    value: 1
    desc: presence of heart disease
