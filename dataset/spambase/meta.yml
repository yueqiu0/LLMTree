name: spambase
target: Classify emails as spam or non-spam based on word and character frequency patterns.
desc: >
  Collected by Hewlett-Packard Labs in 1999 to study automated spam detection. 
  The dataset includes real and spam emails characterized by word usage frequencies, 
  special character counts, and capitalization patterns.
label_meaning: Email type
features:
  - name: freq_your
    desc: Percentage of words matching "your" (%)
    type: float
  - name: freq_000
    desc: Percentage of words matching "000" (%)
    type: float
  - name: freq_remove
    desc: Percentage of words matching "remove" (%)
    type: float
  - name: freq_dollar
    desc: Percentage of characters that are dollar signs ($) (%)
    type: float
  - name: freq_you
    desc: Percentage of words matching "you" (%)
    type: float
  - name: freq_free
    desc: Percentage of words matching "free" (%)
    type: float
  - name: freq_business
    desc: Percentage of words matching "business" (%)
    type: float
  - name: freq_hp
    desc: Percentage of words matching "hp" (%)
    type: float
  - name: capital_total
    desc: Total number of capital letters (characters)
    type: int
  - name: freq_our
    desc: Percentage of words matching "our" (%)
    type: float
  - name: freq_exclamation
    desc: Percentage of characters that are exclamation marks (!) (%)
    type: float
  - name: freq_receive
    desc: Percentage of words matching "receive" (%)
    type: float
  - name: freq_hpl
    desc: Percentage of words matching "hpl" (%)
    type: float
  - name: freq_over
    desc: Percentage of words matching "over" (%)
    type: float
  - name: freq_order
    desc: Percentage of words matching "order" (%)
    type: float
  - name: freq_money
    desc: Percentage of words matching "money" (%)
    type: float
  - name: capital_longest
    desc: Length of longest uninterrupted capital letter sequence (characters)
    type: int
  - name: freq_internet
    desc: Percentage of words matching "internet" (%)
    type: float
labels:
  - name: non_spam
    value: 0
    desc: Legitimate email
  - name: spam
    value: 1
    desc: Unsolicited commercial email
